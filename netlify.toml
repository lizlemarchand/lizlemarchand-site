[build]
  functions = "netlify/functions"

# Keep .html in links so they match canonical tags and the sitemap (fixes Search Console indexing)
[build.processing.html]
  pretty_urls = false

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# The archetype quiz was replaced by the Sales Freeze Scorecard (Nov 2026)
[[redirects]]
  from = "/archetype-quiz.html"
  to = "/sales-freeze-scorecard.html"
  status = 301
  force = true

[[redirects]]
  from = "/assets/selling-archetype-guide.pdf"
  to = "/assets/sales-conversation-decoder.pdf"
  status = 301
  force = true

[build]
  functions = "netlify/functions"

# Keep .html in links so they match canonical tags and the sitemap (fixes Search Console indexing)
[build.processing.html]
  pretty_urls = false

[functions]
  node_bundler = "esbuild"

[functions."analyze"]
  timeout = 26

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
